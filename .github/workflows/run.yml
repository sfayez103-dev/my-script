name: Run Bot

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Chrome
        run: npx puppeteer browsers install chrome

      - name: Run bot
        run: node index.js

      - name: Upload screenshots and Excel
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results
          path: |
            *.jpg
            *.xlsx
